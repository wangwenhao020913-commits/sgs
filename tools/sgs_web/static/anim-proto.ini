# ============================================================================
# PROTOYPE（一次性验证用，不是产品配置）· 飞行时间表
#
# 改完刷新页面即生效（静态文件每次请求都从磁盘读，不必重启服务）。
# 语法：key = value ；# 或 ; 开头为注释；行尾 # 注释会被剥掉。
# 解析失败 / 缺项 → 该键退回内置默认，页面顶栏会提示一行。
#
# 时长单位 = 毫秒。最终每步的等待 = base_step + 该类时长 × (base_step / 100)
# （公式里的 100 就是 base_step 的"标准档"，改 base_step 会同时缩放所有动画）
# ============================================================================

# ---- 基准步长（牌桌「步长」按钮的缺省档；档位 30/50/100/200/300）----
base_step = 100

# ---- 调试：把上面所有时长整体放大 N 倍，便于肉眼看 / 截图。正式观感请设 1 ----
debug_scale = 1

# ---- 单张牌移动的飞行时长（0 = 不飞，只吃 base_step）----
flight_use          = 180    # 手牌 → 处理区（使用牌）
flight_judge_reveal = 180    # 牌堆 → 处理区（判定牌）
flight_draw         = 220    # 牌堆 → 手牌（摸牌）
flight_gain         = 300    # 区 → 手牌（顺手牵羊 / 借刀 / 获得）
flight_discard      = 300    # 区 → 弃牌堆（弃置 / 失去 / 重铸 / 拆）
flight_place_equip  = 320    # → 装备槽（置入装备区，含顶替的新牌）
flight_place_judge  = 320    # → 判定槽（延时锦囊 / 闪电换人）
flight_replace_out  = 280    # 顶替出去的旧装备：槽 → 弃牌堆
flight_stage_out    = 0      # 处理区 → 弃牌堆（使用 / 判定收尾）：不飞

# ---- 同一次移动里 N 张牌（全部起飞，不合并成代表卡）----
# 总错峰时长（毫秒）与横向散开幅度（像素），让 10 张不至于叠成一张
fan_ms = 120
fan_px = 30

# ---- 阶段名飘字（不占步长，只放画面）----
phase_float_ms = 1200
