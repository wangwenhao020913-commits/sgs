# ============================================================================
# 飞行时间表（U4-01 / spec D8）· 页面启动时读取
#
# 改完刷新页面即生效（静态文件每次请求都从磁盘读，不必重启服务）。
# 语法：key = value ；# 或 ; 开头为注释；行尾 # 注释会被剥掉。
# 缺键 / 解析失败 → 该键退回 anim.js 的内置默认，页面底部提示一行。
#
# 时长单位 = 毫秒（0 = 该类不飞）。节奏公式与步长档位归票 02；本表只给"这一类飞多久"。
# ============================================================================

# ---- 基准步长（票 02：牌桌「步长」按钮的缺省档；档位 30/50/100/200/300）----
base_step = 100

# ---- 单张牌移动的飞行时长（0 = 不飞）----
flight_use          = 320    # 手牌 → 处理区（使用牌）
flight_judge_reveal = 320    # 牌堆 / 判定区 → 处理区（判定牌）
flight_draw         = 480    # 牌堆 → 手牌（摸牌；放回牌堆顶也沿用这一条）
flight_gain         = 480    # 区 → 手牌（顺手牵羊 / 借刀 / 获得 / 置入手牌）
flight_discard      = 480    # 区 → 弃牌堆（弃置 / 失去 / 重铸 / 拆 / 置入）
flight_place_equip  = 480    # → 装备槽（置入装备区，含顶替的新牌 / 武将牌上的放置区）
flight_place_judge  = 480    # → 判定槽（延时锦囊 / 闪电换人）
flight_replace_out  = 400    # 顶替出去的旧装备：槽 → 弃牌堆（起跑另错开半拍）
flight_stage_out    = 0      # 处理区 → 弃牌堆（使用 / 判定收尾）：不飞

# ---- 同一次移动里 N 张牌（全部起飞，不合并成代表卡）----
# 总错峰时长（毫秒）与沿路径法向的散开幅度（像素），让 10 张不至于叠成一张
fan_ms = 120
fan_px = 30

# ---- 阶段 / 回合飘字（票 04）：不占步长，只放画面 ----
phase_float_ms = 1200

# ============================================================================
# 无属性伤害动画（damage-fx）· 四档各一套
#
# 单位毫秒。改完保存、刷新页面即生效（静态文件每次请求从磁盘读）。
# 缺键 / 解析失败 → 该键退回 fx-core.js 的内置默认（`SgsDamageFX.DEFAULT_TIMING`，
# 与下表同值），页面底部提示一行（同 anim.js 的规矩）。
# 单档总时长不得超过 2200：再长会挡住牌桌（超出即钳到 2200）。
# 每档的四个时长（total / flight / impact / fade）各自独立，改一档不影响别的档。
# ============================================================================

# ---- 整段寿命：到点摘掉覆盖层 ----
damage_fx_1_total        = 1500
damage_fx_2_total        = 1650
damage_fx_3_total        = 1850
damage_fx_4_total        = 2100

# ---- 剑光从出鞘到命中的飞行时长 ----
damage_fx_1_flight       = 130
damage_fx_2_flight       = 125
damage_fx_3_flight       = 120
damage_fx_4_flight       = 110

# ---- 命中时刻（从演出开始算）----
damage_fx_1_impact       = 330
damage_fx_2_impact       = 330
damage_fx_3_impact       = 340
damage_fx_4_impact       = 340

# ---- 刀痕从命中到完全散尽的时长 ----
#   淡出起点 = 命中 + 这个值的 25%，终点 = 命中 + 这个值
damage_fx_1_fade         = 700
damage_fx_2_fade         = 750
damage_fx_3_fade         = 850
damage_fx_4_fade         = 950

# ---- 只有 3 / 4 点有 ----
damage_fx_3_strobe       = 160    # 黑白屏闪时长
damage_fx_4_strobe       = 440    # 更长
damage_fx_4_split        = 44     # 剑气劈屏的错位像素

# ============================================================================
# 属性伤害演出 · 并发表（damage-fx-natures 票 02）· 三个家族各一条
#
# 同时在播上限：**1~8，缺省 3**。钳制在**读者侧**（`damage-fx.js:damageFxCapFor`）：
# 缺键 / 非数字 → 3；0 或负数 → 1；大于 8 → 8。`anim.js` 只搬数字、不给兜底也不钳
# （与 `fx-core.js` 的 `gameTiming` 同一姿态）。
#
# 为什么要**分属性**：火的 2.0s 天陨与剑光的 1.5s 一刀，"同时播几条"本来就不该相同；
# 一个全局值会把三者绑死——调雷顺手改了剑光的行为，等于悄悄动了上个 effort 的验收基准。
# 演出时长就住在同一份文件里（上面 / 下面两块），两者因此可以一起调；改完刷新即生效。
#
# 超出该家族上限的那几条**丢掉**（伤害本身早已结算，攒着只会把旧伤害飘在新画面上）：
# 队头那条满了就跳过它、让后面还能演的先上，全部家族都满时整队丢。
# 这条上限也是各家族音效声道池的**起始**长度（`sfx-ui.js`；槽号可能被别的家族顶高，
# 池会按需补建，所以池长可能大于这个数）。
# ============================================================================

damage_fx_concurrency          = 3    # 无属性（剑光）；`null` / `NORMAL` 都读它
damage_fx_thunder_concurrency  = 3    # 雷电
damage_fx_fire_concurrency     = 3    # 火焰

# ============================================================================
# 属性伤害演出 · 雷电（damage-fx-natures 票 01）· 四档各一套
#
# 与上面那 19 个键同一个前缀（anim.js 已把 `damage_fx_` 登记为外来键）：
# `damage_fx_thunder_<档>_<字段>`。字段名与内置默认的**唯一真源**是 fx-thunder.js 的
# `SgsThunderFX.DEFAULT_TIMING`；这里只放用户可改的那一份，缺键 / 非法值退回内置默认。
#
# - `strobe` / `flash` 只有 3 / 4 档有：前者的窗口时长就是整屏**着色闪**（冷白）的窗口，
#   后者是 0..1 的强度（不是毫秒），缺省 0.6。
# - 牌桌档（profile = game）读这一块；导出档（profile = export）照素材页的 5~6 秒时间轴，
#   不读这些键。
# - 单档总时长同样不得超过 2200（超出即钳到 2200）。
# ============================================================================

# ---- 整段寿命：到点摘掉覆盖层 ----
damage_fx_thunder_1_total    = 1400
damage_fx_thunder_2_total    = 1500
damage_fx_thunder_3_total    = 1700
damage_fx_thunder_4_total    = 2000

# ---- 雷光从出牌到命中的飞行时长 ----
damage_fx_thunder_1_flight   = 110
damage_fx_thunder_2_flight   = 115
damage_fx_thunder_3_flight   = 120
damage_fx_thunder_4_flight   = 125

# ---- 命中时刻（从演出开始算）----
damage_fx_thunder_1_impact   = 300
damage_fx_thunder_2_impact   = 310
damage_fx_thunder_3_impact   = 330
damage_fx_thunder_4_impact   = 360

# ---- 墨痕 / 余电从命中到完全散尽的时长 ----
#   淡出起点 = 命中 + 这个值的 25%，终点 = 命中 + 这个值
damage_fx_thunder_1_fade     = 700
damage_fx_thunder_2_fade     = 750
damage_fx_thunder_3_fade     = 820
damage_fx_thunder_4_fade     = 900

# ---- 只有 3 / 4 点有 ----
damage_fx_thunder_3_strobe   = 160    # 冷白整屏闪的窗口时长
damage_fx_thunder_3_flash    = 0.6    # 强度（0..1）
damage_fx_thunder_4_strobe   = 260    # 更长
damage_fx_thunder_4_flash    = 0.6

# ============================================================================
# 属性伤害演出 · 火焰（damage-fx-natures 票 03）· 四档各一套
#
# 与上面那两块同一个前缀（anim.js 已把 `damage_fx_` 登记为外来键）：
# `damage_fx_fire_<档>_<字段>`。字段名与内置默认的**唯一真源**是 fx-fire.js 的
# `SgsFireFX.DEFAULT_TIMING`；这里只放用户可改的那一份，缺键 / 非法值退回内置默认。
#
# **1 / 2 档**（轻演出：游戏照常走）与 **3 / 4 档**（**时停演出**：回放在这段里冻住，
# 与雷的 3 / 4 档同一个口径）用两套字段：
#
#   1 / 2 档：total / flight / impact / fade
#   3 / 4 档：total / flight / impact / **boom** / strobe / flash
#
# - `total` = 整段寿命（到点摘掉覆盖层）。3 / 4 档可以很长——回放在这段时间里是冻住的，
#   所以它不"挡住牌桌"，只是把这一下伤害演完。
# - `boom` = **爆炸 / 陨星那一段**的时长（从最后一支箭钉住到收尾）。素材页「最后一击 →
#   收尾」是 4.16s（3 档）/ 4.69s（4 档），等比压进 `boom`；4 档还会先在这段里切出
#   「火云 → 流星砸下」（约 0.6s），剩下的才是爆炸。**给足才看得清天陨**。
# - `strobe` / `flash` 只有 3 / 4 档有：前者的窗口时长就是整屏**着色闪**（暖白）的窗口，
#   后者是 0..1 的强度（不是毫秒），缺省 0.6。
# - 钳制：`total ≤ 4500`（火的上限比雷宽，3 / 4 档是时停窗口里的两段戏）；1 / 2 档
#   的 `fade` 与 3 / 4 档的 `boom` 都会被读者侧钳到"剩下的那段"（`total − impact` /
#   `total − 最后一击`）——超出不是错误，只是不会比剩下的时间更长。改完刷新页面即生效。
# ============================================================================

# ---- 整段寿命：到点摘掉覆盖层 ----
damage_fx_fire_1_total       = 2000
damage_fx_fire_2_total       = 2200
damage_fx_fire_3_total       = 2600    # 箭串 + 爆燃（时停）
damage_fx_fire_4_total       = 3600    # 箭串 + 火云 / 流星 / 天陨（时停）

# ---- 单支火羽从离弦到钉进目标牌的飞行时长 ----
damage_fx_fire_1_flight      = 240
damage_fx_fire_2_flight      = 220
damage_fx_fire_3_flight      = 200
damage_fx_fire_4_flight      = 180

# ---- 第一支箭命中时刻（从演出开始算）----
damage_fx_fire_1_impact      = 300
damage_fx_fire_2_impact      = 280
damage_fx_fire_3_impact      = 260
damage_fx_fire_4_impact      = 240

# ---- 1 / 2 档：焦痕 / 余火从最后一击到完全散尽的时长 ----
#   淡出起点 = 最后一击 + 这个值的 25%，终点 = 最后一击 + 这个值；
#   给得比剩下的时间还长时按剩下的时间算（不会把层拖住）。
damage_fx_fire_1_fade        = 1500
damage_fx_fire_2_fade        = 2100

# ---- 3 / 4 档：爆炸 / 陨星段的时长（从最后一支箭钉住算）----
damage_fx_fire_3_boom        = 1800
damage_fx_fire_4_boom        = 2400

# ---- 只有 3 / 4 点有 ----
damage_fx_fire_3_strobe      = 120    # 暖白整屏闪的窗口时长
damage_fx_fire_3_flash       = 0.6    # 强度（0..1）
damage_fx_fire_4_strobe      = 160    # 更长
damage_fx_fire_4_flash       = 0.8

# ============================================================================
# 铁索连环演出 · 横置 / 重置（chain-death-voices 票 01）· 一次性排程
#
# 与上面那几块同一个前缀结构：`chain_fx_<模式>_<字段>`。字段名与内置默认的**唯一真源**
# 是 fx-chain.js 的 `SgsChainFX.DEFAULT_TIMING`；这里只放用户可改的那一份，缺键 / 非法值
# 退回内置默认（anim.js 已把 `chain_fx_` 登记为外来键，不算未知键）。
#
# 单位毫秒。**没有时停**：演出期间回放照常推进（用户口径），所以它必须自己管住窗口——
# 钳制在读者侧（`SgsChainFX.gameTiming`）：低于 800 夹到 800、高于 2400 夹到 2400。
# 素材页的基准是 link 1.36s / break 1.24s；改这两个数 = 整条演出等比压 / 拉开（末帧不变），
# 画面与音效读的是同一份数字。
# ============================================================================

# ---- 整段寿命：到点摘掉覆盖层 ----
chain_fx_link_total   = 1360    # 入链（横置）：干笔引路 → 铁索滑入 → 落定回弹
chain_fx_break_total  = 1240    # 解锁（重置）：绷紧 → 崩断 → 两断化墨

# ============================================================================
# 阵亡演出（chain-death-voices 票 02）· 一次性排程
#
# 字段名与内置默认的**唯一真源**是 fx-death.js 的 `SgsDeathFX.DEFAULT_TIMING`；这里只放
# 用户可改的那一份，缺键 / 非法值退回内置默认（anim.js 已把 `death_fx_` 登记为外来键，
# 不算未知键）。
#
# 单位毫秒。**没有时停**：用户口径「阵亡均无时停」——演出期间回放照常推进，后续事件会画在
# "正在碎的牌"旁边（预期，不是漏接）。所以它必须自己管住窗口——钳制在读者侧
# （`SgsDeathFX.gameTiming`）：低于 1200 夹到 1200、高于 3200 夹到 3200。
#
# 素材页的基准是 3.05s（泛白 → 裂 → 停一下 → 碎 → 落印）；改这一个数 = 整条演出**等比**
# 压 / 拉开（`k = total / 3050` 乘在 waves / holdAt / burstAt / labelAt 上，末帧不变），
# 画面与音效读的是同一份数字。缺省 2200 ⇒ hold → burst 的停顿约 0.25s（素材包 §8 的下限
# 0.2s 仍守）。
# ============================================================================

# ---- 整段寿命：到点摘掉覆盖层，牌交还给游戏（灰 + 「阵亡」标签回来）----
death_fx_total        = 2200
