<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGS · 三国杀（M4 极简界面）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>SGS <span class="dim">极简界面</span></h1>
  <nav>
    <button id="nav-lobby" class="tab on" type="button">开局</button>
    <button id="nav-table" class="tab" type="button" disabled>牌桌</button>
    <button id="nav-replay" class="tab" type="button">回放</button>
  </nav>
  <span id="status" class="dim"></span>
</header>

<!-- 开局页 -->
<main id="view-lobby" class="view">
  <form id="lobby-form" class="panel">
    <h2>开一局</h2>
    <div class="grid">
      <label>人数
        <select id="in-players">
          <option value="8" selected>8（标准身份局）</option>
          <option value="7">7</option>
          <option value="6">6</option>
          <option value="5">5</option>
          <option value="4">4</option>
        </select>
      </label>
      <label>AI 档位
        <select id="in-ai">
          <option value="heuristic" selected>启发式（会打牌）</option>
          <option value="random">随机（基线）</option>
        </select>
      </label>
      <label>我的座位
        <select id="in-seat"></select>
      </label>
      <label>思考时限（秒，0 = 关）
        <input id="in-timeout" type="number" min="0" step="5" value="60">
      </label>
      <label>种子（留空 = 现生成）
        <input id="in-seed" type="text" inputmode="numeric" placeholder="例如 20261012">
      </label>
    </div>
    <div class="row">
      <button id="btn-start" type="submit" class="primary">开始对局</button>
      <span id="lobby-hint" class="dim"></span>
    </div>
  </form>
  <section class="panel">
    <h2>已有录像</h2>
    <div id="run-list" class="runs"></div>
  </section>
</main>

<!-- 牌桌页 -->
<main id="view-table" class="view" hidden>
  <div class="row space">
    <div>
      <span class="tag">种子</span> <code id="t-seed"></code>
      <span class="tag">座位</span> <code id="t-seat"></code>
      <span class="tag">回合计</span> <code id="t-phase"></code>
      <span class="tag">轮到</span> <code id="t-turn"></code>
    </div>
    <div>
      <span id="t-timer" class="timer"></span>
      <button id="btn-takeover" type="button" class="ghost" title="到时限由服务端确定性代答">请服务端判定</button>
      <button id="btn-refresh" type="button" class="ghost">刷新</button>
    </div>
  </div>

  <section id="t-seats" class="seats"></section>

  <div class="cols">
    <section class="panel grow">
      <h2>我的区域</h2>
      <div class="zone">
        <h3>手牌 <span id="t-hand-count" class="dim"></span></h3>
        <div id="t-hand" class="cards"></div>
      </div>
      <div class="zone">
        <h3>我的武将</h3>
        <div id="t-hero" class="dim"></div>
      </div>
    </section>

    <section class="panel grow">
      <h2>技能 <span class="dim">（绿色=现在能发动；深灰=主动技但现在不满足；银灰=锁定/被动，引擎在时机上自动派发）</span></h2>
      <div id="t-skills" class="skills"></div>
    </section>

    <section class="panel grow">
      <h2>询问</h2>
      <div class="zone">
        <h3>效果区 / 处理区
          <span class="dim">（公开：亮出的牌所有人都看得见，不只在轮到自己时）</span>
        </h3>
        <div id="t-processing" class="cards"></div>
      </div>
      <p id="t-context" class="context"></p>
      <p id="t-prompt" class="prompt">（等引擎提问）</p>
      <p id="t-target-hint" class="hint"></p>
      <div id="t-options" class="options"></div>
      <div class="row">
        <button id="btn-submit" type="button" class="primary" disabled>提交</button>
        <button id="btn-cancel" type="button" class="ghost" disabled>清空选择</button>
        <span id="t-choice" class="dim"></span>
      </div>
    </section>
  </div>

  <section class="panel">
    <h2>事件流
      <span class="dim">（只显示公开事实；对手手牌只有数量）</span>
      <select id="t-log-mode" title="事件流的详略">
        <option value="focus" selected>重点（隐藏对手的响应往来）</option>
        <option value="all">全部（逐条，含对手响应）</option>
      </select>
    </h2>
    <ol id="t-log" class="log"></ol>
  </section>
</main>

<!-- 回放页 -->
<main id="view-replay" class="view" hidden>
  <div class="row space">
    <div>
      <span class="tag">录像</span> <code id="r-name"></code>
      <span class="tag">种子</span> <code id="r-seed"></code>
      <span class="tag">武将</span> <span id="r-heroes" class="dim"></span>
    </div>
    <div>
      <button id="btn-r-first" type="button" class="ghost">⏮</button>
      <button id="btn-r-prev" type="button" class="ghost">◀</button>
      <button id="btn-r-play" type="button" class="ghost">▶</button>
      <button id="btn-r-next" type="button" class="ghost">▶|</button>
      <button id="btn-r-last" type="button" class="ghost">⏭</button>
      <span id="r-pos" class="dim"></span>
    </div>
  </div>
  <p class="dim">上帝视角：回放直接消费全知记录流（`06` §5 账本「回放页取上帝视角」）。</p>
  <section id="r-seats" class="seats"></section>
  <section class="panel">
    <h2>事件流</h2>
    <ol id="r-log" class="log"></ol>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
